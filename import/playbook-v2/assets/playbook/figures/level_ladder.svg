<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 1080 400" role="img" aria-labelledby="ladder-title ladder-desc"><rect width="1080" height="400" fill="#EAE2CD"/><style>text{font-family:Archivo,Arial,sans-serif;fill:#1E1B16}.t-label{font-size:16px;font-weight:600}.t-strong{font-weight:700}.t-num{font-family:Besley,Georgia,serif;font-size:16px;font-weight:900}.t-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;fill:#5C554A}.t-mono{font-family:'Courier Prime','Courier New',monospace;font-size:13px;fill:#5C554A}.t-small{font-size:12px}.t-acc{fill:#8F6D0C;font-weight:700}.stroke{stroke-linecap:round;stroke-linejoin:round}</style><title id="ladder-title">The level ladder</title><desc id="ladder-desc">Four ascending levels with their durations and graduation gates, drawn against a week axis that marks the 66-day habit window.</desc><defs><marker id="arr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C554A"/></marker></defs><rect style="--i:0" class="stroke" pathLength="1" x="40" y="188" width="236" height="92" fill="#EAE2CD" stroke="#1E1B16" stroke-width="1.25"/><text style="--i:1" x="54" y="216" class="t-label t-strong fill">Starter</text><text style="--i:1" x="54" y="236" class="t-mono fill">2–3 wks</text><rect style="--i:2" class="stroke" pathLength="1" x="244" y="212" width="16" height="12" fill="none" stroke="#1E1B16" stroke-width="1.25"/><path style="--i:2" class="stroke" pathLength="1" d="M248 212 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#1E1B16" stroke-width="1.25"/><text style="--i:3" x="40" y="324" class="t-mono t-small fill">Printed “How I operate”</text><text style="--i:3" x="40" y="342" class="t-mono t-small fill">first real run in 7 days</text><rect style="--i:4" class="stroke" pathLength="1" x="304" y="140" width="236" height="140" fill="#EAE2CD" stroke="#1E1B16" stroke-width="1.25"/><text style="--i:5" x="318" y="168" class="t-label t-strong fill">Intermediate</text><text style="--i:5" x="318" y="188" class="t-mono fill">4–6 wks</text><rect style="--i:6" class="stroke" pathLength="1" x="508" y="164" width="16" height="12" fill="none" stroke="#1E1B16" stroke-width="1.25"/><path style="--i:6" class="stroke" pathLength="1" d="M512 164 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#1E1B16" stroke-width="1.25"/><text style="--i:7" x="304" y="324" class="t-mono t-small fill">Day-30 review passed</text><text style="--i:7" x="304" y="342" class="t-mono t-small fill">weekly review running</text><rect style="--i:8" class="stroke" pathLength="1" x="568" y="80" width="236" height="200" fill="#8F6D0C" fill-opacity="0.14" stroke="#8F6D0C" stroke-width="1.6"/><text style="--i:9" x="582" y="108" class="t-label t-strong fill">Expert</text><text style="--i:9" x="582" y="128" class="t-mono fill">~10 wks</text><rect style="--i:10" class="stroke" pathLength="1" x="772" y="104" width="16" height="12" fill="none" stroke="#8F6D0C" stroke-width="1.25"/><path style="--i:10" class="stroke" pathLength="1" d="M776 104 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#8F6D0C" stroke-width="1.25"/><text style="--i:11" x="582" y="152" class="t-mono t-acc fill">SECURITY BASELINE GATES</text><text style="--i:12" x="568" y="324" class="t-mono t-small fill">Kill-switch drilled</text><text style="--i:12" x="568" y="342" class="t-mono t-small fill">no unenforceable action</text><text style="--i:12" x="568" y="360" class="t-mono t-small fill">backup restored</text><rect style="--i:13" class="stroke" pathLength="1" x="832" y="30" width="236" height="250" fill="#EAE2CD" stroke="#1E1B16" stroke-width="1.25"/><text style="--i:14" x="846" y="58" class="t-label t-strong fill">Frontier Operator</text><text style="--i:14" x="846" y="78" class="t-mono fill">12–14 wks</text><rect style="--i:15" class="stroke" pathLength="1" x="1036" y="54" width="16" height="12" fill="none" stroke="#1E1B16" stroke-width="1.25"/><path style="--i:15" class="stroke" pathLength="1" d="M1040 54 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#1E1B16" stroke-width="1.25"/><text style="--i:16" x="832" y="324" class="t-mono t-small fill">Before/after radar</text><text style="--i:16" x="832" y="342" class="t-mono t-small fill">portability run</text><text style="--i:16" x="832" y="360" class="t-mono t-small fill">exec summary</text><line style="--i:17" class="stroke" pathLength="1" x1="40" y1="280" x2="1068" y2="280" stroke="#1E1B16" stroke-width="1.25"/><text style="--i:18" x="40" y="302" class="t-eyebrow fill">GATE TO THE NEXT LEVEL</text><rect style="--i:18" class="fill" x="40" y="273" width="564" height="6" fill="#8F6D0C" fill-opacity="0.6"/><line style="--i:19" class="stroke" pathLength="1" x1="604" y1="256" x2="604" y2="280" stroke="#8F6D0C" stroke-width="1.25"/><text style="--i:20" x="54" y="264" class="t-mono t-acc fill">DAY 0 → 66 · HABIT WINDOW</text><text style="--i:21" x="1068" y="302" text-anchor="end" class="t-eyebrow fill">NOTHING IS REPEATED · NOTHING IS SKIPPED</text></svg>
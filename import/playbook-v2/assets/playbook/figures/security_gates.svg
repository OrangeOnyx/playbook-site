<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 1080 424" role="img" aria-labelledby="gates-title gates-desc"><rect width="1080" height="424" fill="#EAE2CD"/><style>text{font-family:Archivo,Arial,sans-serif;fill:#1E1B16}.t-label{font-size:16px;font-weight:600}.t-strong{font-weight:700}.t-num{font-family:Besley,Georgia,serif;font-size:16px;font-weight:900}.t-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;fill:#5C554A}.t-mono{font-family:'Courier Prime','Courier New',monospace;font-size:13px;fill:#5C554A}.t-small{font-size:12px}.t-acc{fill:#8F6D0C;font-weight:700}.stroke{stroke-linecap:round;stroke-linejoin:round}</style><title id="gates-title">Security gates</title><desc id="gates-desc">Four locks stand between Intermediate and Expert: credential inventory, least-privilege audit, data classification, and a drilled kill switch.</desc><defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1E1B16"/></marker></defs><text style="--i:0" x="40" y="52" class="t-eyebrow fill">INTERMEDIATE</text><text style="--i:0" x="40" y="74" class="t-small fill">the system remembers</text><text style="--i:1" x="1040" y="52" class="t-eyebrow fill" text-anchor="end">EXPERT</text><text style="--i:1" x="1040" y="74" class="t-small fill" text-anchor="end">governed delegation</text><line style="--i:2" class="stroke" pathLength="1" x1="40" y1="120" x2="1040" y2="120" stroke="#1E1B16" stroke-width="1.25"/><rect style="--i:3" class="stroke" pathLength="1" x="40" y="140" width="232" height="176" fill="#EAE2CD" stroke="#1E1B16" stroke-width="1.25"/><rect style="--i:4" class="stroke" pathLength="1" x="145.0" y="176" width="22" height="16" fill="none" stroke="#8F6D0C" stroke-width="1.6"/><path style="--i:4" class="stroke" pathLength="1" d="M 150.0 176 V 169 A 6 6 0 0 1 162.0 169 V 176" fill="none" stroke="#8F6D0C" stroke-width="1.6"/><text style="--i:5" x="156.0" y="226" class="t-label t-strong fill" text-anchor="middle">Credential inventory</text><text style="--i:6" x="156.0" y="250" class="t-small fill" text-anchor="middle">every key</text><text style="--i:6" x="156.0" y="267" class="t-small fill" text-anchor="middle">where it lives</text><text style="--i:6" x="156.0" y="284" class="t-small fill" text-anchor="middle">who holds it</text><text style="--i:6" x="156.0" y="301" class="t-small fill" text-anchor="middle">last rotated</text><text x="52" y="160" class="t-num t-acc fill" style="font-size:12px;--i:7">1</text><rect style="--i:8" class="stroke" pathLength="1" x="296" y="140" width="232" height="176" fill="#EAE2CD" stroke="#1E1B16" stroke-width="1.25"/><rect style="--i:9" class="stroke" pathLength="1" x="401.0" y="176" width="22" height="16" fill="none" stroke="#8F6D0C" stroke-width="1.6"/><path style="--i:9" class="stroke" pathLength="1" d="M 406.0 176 V 169 A 6 6 0 0 1 418.0 169 V 176" fill="none" stroke="#8F6D0C" stroke-width="1.6"/><text style="--i:10" x="412.0" y="226" class="t-label t-strong fill" text-anchor="middle">Least-privilege audit</text><text style="--i:11" x="412.0" y="250" class="t-small fill" text-anchor="middle">narrowest sufficient access</text><text style="--i:11" x="412.0" y="267" class="t-small fill" text-anchor="middle">reviewed on a cadence</text><text x="308" y="160" class="t-num t-acc fill" style="font-size:12px;--i:12">2</text><rect style="--i:13" class="stroke" pathLength="1" x="552" y="140" width="232" height="176" fill="#EAE2CD" stroke="#1E1B16" stroke-width="1.25"/><rect style="--i:14" class="stroke" pathLength="1" x="657.0" y="176" width="22" height="16" fill="none" stroke="#8F6D0C" stroke-width="1.6"/><path style="--i:14" class="stroke" pathLength="1" d="M 662.0 176 V 169 A 6 6 0 0 1 674.0 169 V 176" fill="none" stroke="#8F6D0C" stroke-width="1.6"/><text style="--i:15" x="668.0" y="226" class="t-label t-strong fill" text-anchor="middle">Data classification</text><text style="--i:16" x="668.0" y="250" class="t-small fill" text-anchor="middle">sensitivity tiers</text><text style="--i:16" x="668.0" y="267" class="t-small fill" text-anchor="middle">the “never paste” list</text><text style="--i:16" x="668.0" y="284" class="t-small fill" text-anchor="middle">retention</text><text x="564" y="160" class="t-num t-acc fill" style="font-size:12px;--i:17">3</text><rect style="--i:18" class="stroke" pathLength="1" x="808" y="140" width="232" height="176" fill="#EAE2CD" stroke="#1E1B16" stroke-width="1.25"/><rect style="--i:19" class="stroke" pathLength="1" x="913.0" y="176" width="22" height="16" fill="none" stroke="#8F6D0C" stroke-width="1.6"/><path style="--i:19" class="stroke" pathLength="1" d="M 918.0 176 V 169 A 6 6 0 0 1 930.0 169 V 176" fill="none" stroke="#8F6D0C" stroke-width="1.6"/><text style="--i:20" x="924.0" y="226" class="t-label t-strong fill" text-anchor="middle">Kill switch, drilled</text><text style="--i:21" x="924.0" y="250" class="t-small fill" text-anchor="middle">disable</text><text style="--i:21" x="924.0" y="267" class="t-small fill" text-anchor="middle">assess</text><text style="--i:21" x="924.0" y="284" class="t-small fill" text-anchor="middle">roll back</text><text style="--i:21" x="924.0" y="301" class="t-small fill" text-anchor="middle">tested live</text><text x="820" y="160" class="t-num t-acc fill" style="font-size:12px;--i:22">4</text><text style="--i:23" x="540" y="352" class="t-eyebrow fill" text-anchor="middle">ALL FOUR OPEN · OR NO EXPERT GRADUATION</text><text style="--i:24" x="540" y="380" class="t-small fill" text-anchor="middle">No unenforceable protected action. No incomplete inventory. No undrilled kill switch.</text><text style="--i:25" x="540" y="400" class="t-small fill" text-anchor="middle">A bounded operator without an enforceable boundary is a liability with a run log.</text></svg>
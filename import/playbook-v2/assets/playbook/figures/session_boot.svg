<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 1080 470" role="img" aria-labelledby="boot-title boot-desc"><rect width="1080" height="470" fill="#EAE2CD"/><style>text{font-family:Archivo,Arial,sans-serif;fill:#1E1B16}.t-label{font-size:16px;font-weight:600}.t-strong{font-weight:700}.t-num{font-family:Besley,Georgia,serif;font-size:16px;font-weight:900}.t-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;fill:#5C554A}.t-mono{font-family:'Courier Prime','Courier New',monospace;font-size:13px;fill:#5C554A}.t-small{font-size:12px}.t-acc{fill:#49573C;font-weight:700}.stroke{stroke-linecap:round;stroke-linejoin:round}</style><title id="boot-title">Session boot sequence flow</title><desc id="boot-desc">Every session boots by reading identity, context, and memory, works one task, and shuts down by writing the log; the weekly review wraps the whole protocol.</desc><defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1E1B16"/></marker></defs><rect style="--i:0" class="stroke" pathLength="1" x="40" y="40" width="1000" height="396" fill="#EAE2CD" stroke="#1E1B16" stroke-width="1.25" stroke-dasharray="4 3"/><text style="--i:1" x="56" y="66" class="t-eyebrow fill">THE WEEKLY REVIEW · 20 MINUTES · SAME TIME EACH WEEK · CONSUMES WHAT THE PROTOCOL COLLECTS</text><rect style="--i:2" class="stroke" pathLength="1" x="72" y="100" width="300" height="236" fill="#49573C" fill-opacity="0.14" stroke="#49573C" stroke-width="1.6"/><text style="--i:3" x="88" y="128" class="t-num fill">BOOT</text><text style="--i:3" x="88" y="146" class="t-eyebrow fill">START OF EVERY SESSION</text><text x="88" y="178" class="t-num t-acc fill" style="font-size:12px;--i:4">1</text><text style="--i:4" x="110" y="178" class="t-small fill">Read identity · SOUL.md</text><text x="88" y="208" class="t-num t-acc fill" style="font-size:12px;--i:5">2</text><text style="--i:5" x="110" y="208" class="t-small fill">Read user context · USER.md</text><text x="88" y="238" class="t-num t-acc fill" style="font-size:12px;--i:6">3</text><text style="--i:6" x="110" y="238" class="t-small fill">Read recent memory · daily logs</text><text x="88" y="268" class="t-num t-acc fill" style="font-size:12px;--i:7">4</text><text style="--i:7" x="110" y="268" class="t-small fill">Check capture queue · open loops</text><text x="88" y="298" class="t-num t-acc fill" style="font-size:12px;--i:8">5</text><text style="--i:8" x="110" y="298" class="t-small fill">State the task against QUARTER.md</text><rect style="--i:9" class="stroke" pathLength="1" x="428" y="170" width="224" height="96" fill="#EAE2CD" stroke="#1E1B16" stroke-width="1.25"/><text style="--i:10" x="540.0" y="208" class="t-num fill" text-anchor="middle">WORK</text><text style="--i:10" x="540.0" y="232" class="t-small fill" text-anchor="middle">one task · one artifact</text><rect style="--i:11" class="stroke" pathLength="1" x="708" y="100" width="300" height="236" fill="#EAE2CD" stroke="#1E1B16" stroke-width="1.25"/><text style="--i:12" x="724" y="128" class="t-num fill">SHUTDOWN</text><text style="--i:12" x="724" y="146" class="t-eyebrow fill">END OF EVERY SESSION</text><text x="724" y="178" class="t-num fill" style="font-size:12px;--i:13">1</text><text style="--i:13" x="746" y="178" class="t-small fill">Write session summary · daily log</text><text x="724" y="208" class="t-num fill" style="font-size:12px;--i:14">2</text><text style="--i:14" x="746" y="208" class="t-small fill">Record decisions as proposed memory</text><text x="724" y="238" class="t-num fill" style="font-size:12px;--i:15">3</text><text style="--i:15" x="746" y="238" class="t-small fill">List open loops · next actions</text><text x="724" y="268" class="t-num fill" style="font-size:12px;--i:16">4</text><text style="--i:16" x="746" y="268" class="t-small fill">Log failures for the evidence log</text><line style="--i:17" class="stroke" pathLength="1" x1="374" y1="218" x2="426" y2="218" stroke="#1E1B16" stroke-width="1.25" marker-end="url(#arr)"/><line style="--i:18" class="stroke" pathLength="1" x1="654" y1="218" x2="706" y2="218" stroke="#1E1B16" stroke-width="1.25" marker-end="url(#arr)"/><path style="--i:19" class="stroke" pathLength="1" d="M 858 336 L 858 368 A 8 8 0 0 1 850 376 L 230 376 A 8 8 0 0 1 222 368 L 222 338" fill="none" stroke="#5C554A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/><text style="--i:20" x="540" y="396" class="t-eyebrow fill" text-anchor="middle">TOMORROW’S BOOT READS TONIGHT’S LOG</text><text style="--i:21" x="56" y="420" class="t-eyebrow fill">INSTALLED AT INTERMEDIATE · REQUIRED IN EVERY BOUNDED-OPERATOR BRIEF AT EXPERT</text><text style="--i:22" x="56" y="460" class="t-small fill">Without a defined start and end, captured inputs and stored memory have no consumer. They pile up.</text></svg>
<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 1080 440" role="img" aria-labelledby="runway-title runway-desc"><rect width="1080" height="440" fill="#EAE2CD"/><style>text{font-family:Archivo,Arial,sans-serif;fill:#1E1B16}.t-label{font-size:16px;font-weight:600}.t-strong{font-weight:700}.t-num{font-family:Besley,Georgia,serif;font-size:16px;font-weight:900}.t-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;fill:#5C554A}.t-mono{font-family:'Courier Prime','Courier New',monospace;font-size:13px;fill:#5C554A}.t-small{font-size:12px}.t-acc{fill:#8F6D0C;font-weight:700}.stroke{stroke-linecap:round;stroke-linejoin:round}</style><title id="runway-title">Reinforcement runway timeline</title><desc id="runway-desc">A forgetting curve loses most of what a program teaches within a week; scheduled touchpoints at days 3, 7, 30, 66, 90, 180, and 365 keep the system alive until it is a habit.</desc><defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1E1B16"/></marker></defs><line style="--i:0" class="stroke" pathLength="1" x1="40" y1="300" x2="1040" y2="300" stroke="#1E1B16" stroke-width="1.25"/><text style="--i:1" x="40" y="324" class="t-eyebrow fill">DAY 1</text><path style="--i:2" class="stroke" pathLength="1" d="M 70 100 L 85.7 107.9 L 125.3 129.6 L 175.3 159.6 L 226.6 191.6 L 275.1 220.2 L 319.7 242.4 L 360.3 257.5 L 397.2 266.7 L 430.9 271.7 L 461.8 274.2 L 490.3 275.3 L 516.6 275.8 L 541.1 275.9 L 564 276 L 585.4 276 L 605.6 276 L 624.6 276 L 642.6 276 L 659.7 276 L 676 276 L 691.5 276 L 706.3 276 L 720.5 276 L 734.1 276 L 747.2 276 L 759.8 276 L 771.9 276 L 783.6 276 L 794.9 276 L 805.8 276 L 816.3 276 L 826.5 276 L 836.5 276 L 846.1 276 L 855.5 276 L 864.6 276 L 873.4 276 L 882 276 L 890.4 276 L 898.6 276 L 906.6 276 L 914.4 276 L 922 276 L 929.4 276 L 936.7 276 L 943.8 276 L 950.8 276 L 957.6 276 L 964.3 276 L 970.9 276 L 977.3 276 L 983.6 276 L 989.8 276 L 995.8 276 L 1001.8 276 L 1007.6 276 L 1013.4 276 L 1019 276 L 1024.5 276 L 1030 276" fill="none" stroke="#5C554A" stroke-width="1.25" stroke-dasharray="5 4"/><text style="--i:3" x="212.4516288151034" y="170" class="t-small fill">unreinforced: most of it gone within a week</text><path style="--i:4" class="stroke" pathLength="1" d="M 70 100 L 246.8 137 L 248.8 108 L 384.6 143 L 386.6 108 L 621.4 166.3 L 623.4 108 L 749.7 140.1 L 751.7 100 L 800.2 115.5 L 802.2 100 L 913 135.3 L 915 100 L 1028 136 L 1030 100" fill="none" stroke="#8F6D0C" stroke-width="2.2"/><rect style="--i:5" class="fill" x="40" y="340" width="711.718394626496" height="8" fill="#8F6D0C" fill-opacity="0.35"/><text style="--i:5" x="40" y="368" class="t-eyebrow fill">MEDIAN 66 DAYS TO AUTOMATIC · THE PROGRAM LANDS INSIDE IT ON PURPOSE</text><line style="--i:6" class="stroke" pathLength="1" x1="248.8" y1="290" x2="248.8" y2="310" stroke="#8F6D0C" stroke-width="2"/><text style="--i:6" x="248.8" y="328" text-anchor="middle" class="t-num t-acc fill">3</text><text style="--i:6" x="248.7603637681896" y="78" class="t-small fill" text-anchor="middle">Booster</text><line style="--i:7" class="stroke" pathLength="1" x1="386.6" y1="290" x2="386.6" y2="310" stroke="#8F6D0C" stroke-width="2"/><text style="--i:7" x="386.6" y="328" text-anchor="middle" class="t-num t-acc fill">7</text><text style="--i:7" x="386.6281769222278" y="58" class="t-small fill" text-anchor="middle">First real use</text><line style="--i:8" class="stroke" pathLength="1" x1="623.4" y1="290" x2="623.4" y2="310" stroke="#8F6D0C" stroke-width="2"/><text style="--i:8" x="623.4" y="328" text-anchor="middle" class="t-num t-acc fill">30</text><text style="--i:8" x="623.4247955030996" y="78" class="t-small fill" text-anchor="middle">Delayed recall</text><line style="--i:9" class="stroke" pathLength="1" x1="751.7" y1="290" x2="751.7" y2="310" stroke="#8F6D0C" stroke-width="2"/><text style="--i:9" x="751.7" y="328" text-anchor="middle" class="t-num t-acc fill">66</text><text style="--i:9" x="751.718394626496" y="58" class="t-small fill" text-anchor="middle">Automaticity</text><line style="--i:10" class="stroke" pathLength="1" x1="802.2" y1="290" x2="802.2" y2="310" stroke="#8F6D0C" stroke-width="2"/><text style="--i:10" x="802.2" y="328" text-anchor="middle" class="t-num t-acc fill">90</text><text style="--i:10" x="802.1851592712892" y="78" class="t-small fill" text-anchor="middle">Operating review</text><line style="--i:11" class="stroke" pathLength="1" x1="915" y1="290" x2="915" y2="310" stroke="#8F6D0C" stroke-width="2"/><text style="--i:11" x="915" y="328" text-anchor="middle" class="t-num t-acc fill">180</text><text style="--i:11" x="914.9703915318972" y="58" class="t-small fill" text-anchor="middle">The standard</text><line style="--i:12" class="stroke" pathLength="1" x1="1030" y1="290" x2="1030" y2="310" stroke="#8F6D0C" stroke-width="2"/><text style="--i:12" x="1030" y="328" text-anchor="middle" class="t-num t-acc fill">365</text><text style="--i:12" x="1030.0" y="78" class="t-small fill" text-anchor="middle">Annual review</text><text style="--i:13" x="40" y="52" class="t-eyebrow fill">RETENTION</text><text style="--i:14" x="540" y="412" class="t-small fill" text-anchor="middle">Every touchpoint ends with the next one calendared. Report-and-leave is the market’s complaint; the runway is the refusal.</text></svg>
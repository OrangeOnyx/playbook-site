<figure class="fig plate" id="fig-10"><span class="plate-label">PLATE 10 · OLIVE</span><svg viewBox="0 0 1080 320" role="img" aria-labelledby="capture-title capture-desc"><title id="capture-title">Capture pipeline</title><desc id="capture-desc">Quick and deliberate capture both land in one dated inbox, a daily review keeps, routes, or deletes, and only tasks and validated memory survive.</desc><defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--ink)"/></marker></defs><rect style="--i:0" class="stroke" pathLength="1" x="40" y="60" width="240" height="64" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:1" x="56" y="86" class="t-label t-strong fill">Quick capture</text><text style="--i:1" x="56" y="108" class="t-small fill">under 30 seconds, any device</text><rect style="--i:2" class="stroke" pathLength="1" x="40" y="176" width="240" height="64" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:3" x="56" y="202" class="t-label t-strong fill">Deliberate capture</text><text style="--i:3" x="56" y="224" class="t-small fill">meeting notes, readings, decisions</text><path style="--i:4" class="stroke" pathLength="1" d="M 280 92 L 302 92 A 8 8 0 0 1 310 100 L 310 142 A 8 8 0 0 0 318 150 L 338 150" fill="none" stroke="var(--ink)" stroke-width="1.25" marker-end="url(#arr)"/><path style="--i:5" class="stroke" pathLength="1" d="M 280 208 L 302 208 A 8 8 0 0 0 310 200 L 310 150" fill="none" stroke="var(--ink)" stroke-width="1.25"/><rect style="--i:6" class="stroke" pathLength="1" x="340" y="100" width="250" height="100" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="1.6"/><text style="--i:7" x="356" y="130" class="t-label t-strong fill">One inbox</text><text style="--i:7" x="356" y="150" class="t-mono fill">inbox/YYYY-MM-DD.md</text><text style="--i:7" x="356" y="172" class="t-small fill">nothing lives here;</text><text style="--i:7" x="356" y="188" class="t-small fill">everything passes through</text><line style="--i:8" class="stroke" pathLength="1" x1="592" y1="150" x2="648" y2="150" stroke="var(--ink)" stroke-width="1.25" marker-end="url(#arr)"/><rect style="--i:9" class="stroke" pathLength="1" x="650" y="100" width="180" height="100" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:10" x="666" y="130" class="t-label t-strong fill">Review</text><text style="--i:10" x="666" y="150" class="t-mono fill">daily · 10 min</text><text style="--i:10" x="666" y="172" class="t-small fill">keep, route, or delete</text><path style="--i:11" class="stroke" pathLength="1" d="M 830 150 L 858 150 A 8 8 0 0 0 866 142 L 866 88 A 8 8 0 0 1 874 80 L 898 80" fill="none" stroke="var(--ink)" stroke-width="1.25" marker-end="url(#arr)"/><rect style="--i:12" class="stroke" pathLength="1" x="900" y="50" width="170" height="60" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:13" x="912" y="74" class="t-label t-strong fill">Tasks</text><text style="--i:13" x="912" y="94" class="t-mono fill">TASKS.md</text><path style="--i:14" class="stroke" pathLength="1" d="M 830 150 L 898 150" fill="none" stroke="var(--ink)" stroke-width="1.25" marker-end="url(#arr)"/><rect style="--i:15" class="stroke" pathLength="1" x="900" y="140" width="170" height="60" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:16" x="912" y="164" class="t-label t-strong fill">Proposed memory</text><text style="--i:16" x="912" y="184" class="t-mono fill">MEMORY.md</text><path style="--i:17" class="stroke" pathLength="1" d="M 830 150 L 858 150 A 8 8 0 0 1 866 158 L 866 252 A 8 8 0 0 0 874 260 L 898 260" fill="none" stroke="var(--ink)" stroke-width="1.25" marker-end="url(#arr)"/><rect style="--i:18" class="stroke" pathLength="1" x="900" y="230" width="170" height="60" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25" stroke-dasharray="4 3"/><text style="--i:19" x="912" y="254" class="t-small fill">Trash</text><text style="--i:19" x="912" y="274" class="t-small fill">most of it, on purpose</text><text style="--i:20" x="40" y="292" class="t-eyebrow fill">IF THE INBOX GROWS FOR A WEEK WITHOUT SHRINKING, THE REVIEW IS THE BROKEN PART, NOT THE CAPTURE</text></svg><figcaption><span class="fignum">Fig. 10</span><span>Capture pipeline, two routes, one inbox, one review</span></figcaption><button class="replay" type="button">Replay</button></figure>

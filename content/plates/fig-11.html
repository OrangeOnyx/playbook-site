-label t-strong fill" text-anchor="middle">Run</text><text style="--i:10" x="468.30919022644036" y="172.8146351137604" class="t-small fill">inside the boundary</text><circle style="--i:11" class="stroke" pathLength="1" cx="362.3" cy="343.3" r="30" fill="var(--paper-deep)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:12" x="362.28993532094626" y="348.26237921249265" class="t-label t-strong fill" text-anchor="middle">Log</text><text style="--i:13" x="396.38147995390966" y="394.1853648862396" class="t-small fill">every run · every miss</text><circle style="--i:14" class="stroke" pathLength="1" cx="197.7" cy="343.3" r="30" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="1.8"/><text style="--i:15" x="197.71006467905377" y="348.26237921249265" class="t-label t-strong fill" text-anchor="middle">Review</text><text style="--i:16" x="163.61852004609034" y="394.1853648862396" class="t-small fill" text-anchor="end">the human reads it</text><circle style="--i:17" class="stroke" pathLength="1" cx="146.9" cy="186.7" r="30" fill="var(--paper-deep)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:18" x="146.8520877186785" y="191.73762078750738" class="t-label t-strong fill" text-anchor="middle">Adjust</text><text style="--i:19" x="91.69080977355958" y="172.81463511376043" class="t-small fill" text-anchor="end">brief or boundary</text><text style="--i:20" x="280" y="222" class="t-eyebrow fill" text-anchor="middle">BOUNDED</text><text style="--i:20" x="280" y="242" class="t-eyebrow fill" text-anchor="middle">OPERATOR</text><text style="--i:21" x="640" y="92" class="t-eyebrow fill">THE RUN LOG</text><line style="--i:22" class="fill" x1="640" y1="128" x2="800" y2="128" stroke="var(--rule)" stroke-width="1"/><text style="--i:22" x="640" y="122" class="t-mono fill">date · trigger</text><line style="--i:23" class="fill" x1="640" y1="154" x2="800" y2="154" stroke="var(--rule)" stroke-width="1"/><text style=

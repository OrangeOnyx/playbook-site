<figure class="fig plate" id="fig-12"><span class="plate-label">Plate 12 · mustard</span><svg viewBox="0 0 1080 440" role="img" aria-labelledby="automation-title automation-desc"><title id="automation-title">Automation decision flow</title><desc id="automation-desc">Four questions in order: proven, measured, justified, enforceable. Any no keeps the workflow assisted; four yeses earn a bounded operator.</desc><defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--ink)"/></marker></defs><text style="--i:0" x="40" y="52" class="t-eyebrow fill">A CANDIDATE WORKFLOW</text><rect style="--i:1" class="stroke" pathLength="1" x="40" y="84" width="300" height="60" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:2" x="56" y="110" class="t-small fill">Proven by hand,</text><text style="--i:2" x="56" y="128" class="t-small fill">at least three times?</text><text x="326" y="100" class="t-num fill" style="font-size:12px;--i:3" text-anchor="end">1</text><line style="--i:4" class="stroke" pathLength="1" x1="190.0" y1="146" x2="190.0" y2="164" stroke="var(--ink)" stroke-width="1.25" marker-end="url(#arr)"/><rect style="--i:5" class="fill" x="196.0" y="147" width="26" height="16" fill="var(--paper-deep)"/><text style="--i:5" x="198.0" y="159" class="t-eyebrow fill">YES</text><path style="--i:6" class="stroke" pathLength="1" d="M 340 114 L 392 114 A 8 8 0 0 1 400 122 L 400 214" fill="none" stroke="var(--ink-soft)" stroke-width="1"/><rect style="--i:7" class="stroke" pathLength="1" x="40" y="166" width="300" height="60" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:8" x="56" y="192" class="t-small fill">Measured: baseline and current</text><text style="--i:8" x="56" y="210" class="t-small fill">in the evidence log?</text><text x="326" y="182" class="t-num fill" style="font-size:12px;--i:9" text-anchor="end">2</text><line style="--i:10" class="stroke" pathLength="1" x1="190.0" y1="228" x2="190.0" y2="246" stroke="var(--ink)" stroke-width="1.25" marker-end="url(#arr)"/><rect style="--i:11" class="fill" x="196.0" y="229" width="26" height="16" fill="var(--paper-deep)"/><text style="--i:11" x="198.0" y="241" class="t-eyebrow fill">YES</text><path style="--i:12" class="stroke" pathLength="1" d="M 340 196 L 392 196 A 8 8 0 0 1 400 204 L 400 214" fill="none" stroke="var(--ink-soft)" stroke-width="1"/><rect style="--i:13" class="stroke" pathLength="1" x="40" y="248" width="300" height="60" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:14" x="56" y="274" class="t-small fill">Do the numbers justify</text><text style="--i:14" x="56" y="292" class="t-small fill">the build and the upkeep?</text><text x="326" y="264" class="t-num fill" style="font-size:12px;--i:15" text-anchor="end">3</text><line style="--i:16" class="stroke" pathLength="1" x1="190.0" y1="310" x2="190.0" y2="328" stroke="var(--ink)" stroke-width="1.25" marker-end="url(#arr)"/><rect style="--i:17" class="fill" x="196.0" y="311" width="26" height="16" fill="var(--paper-deep)"/><text style="--i:17" x="198.0" y="323" class="t-eyebrow fill">YES</text><path style="--i:18" class="stroke" pathLength="1" d="M 340 278 L 400 278" fill="none" stroke="var(--ink-soft)" stroke-width="1" marker-end="url(#arr)"/><rect style="--i:19" class="stroke" pathLength="1" x="40" y="330" width="300" height="60" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:20" x="56" y="356" class="t-small fill">Every boundary enforceable by a</text><text style="--i:20" x="56" y="374" class="t-small fill">tool or a human gate?</text><text x="326" y="346" class="t-num fill" style="font-size:12px;--i:21" text-anchor="end">4</text><path style="--i:22" class="stroke" pathLength="1" d="M 340 360 L 392 360 A 8 8 0 0 0 400 352 L 400 214" fill="none" stroke="var(--ink-soft)" stroke-width="1"/><rect style="--i:23" class="fill" x="348" y="88" width="22" height="14" fill="var(--paper-deep)"/><text style="--i:23" x="350" y="99" class="t-eyebrow fill">NO</text><line style="--i:24" class="stroke" pathLength="1" x1="400" y1="214" x2="438" y2="214" stroke="var(--ink-soft)" stroke-width="1" marker-end="url(#arr)"/><rect style="--i:25" class="stroke" pathLength="1" x="440" y="170" width="280" height="88" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25" stroke-dasharray="4 3"/><text style="--i:26" x="456" y="200" class="t-label t-strong fill">Stays assisted</text><text style="--i:26" x="456" y="222" class="t-small fill">documented, and revisited at the</text><text style="--i:26" x="456" y="240" class="t-small fill">next operating review</text><path style="--i:27" class="stroke" pathLength="1" d="M 190 390 L 190 412 A 8 8 0 0 0 198 420 L 572 420 A 8 8 0 0 0 580 412 L 580 402" fill="none" stroke="var(--ink)" stroke-width="1.25" marker-end="url(#arr)"/><text style="--i:28" x="198.0" y="412.0" class="t-eyebrow fill">YES</text><rect style="--i:29" class="stroke" pathLength="1" x="440" y="300" width="280" height="100" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="1.6"/><text style="--i:30" x="456" y="330" class="t-label t-strong fill">Automate</text><text style="--i:30" x="456" y="352" class="t-small fill">as a bounded operator, with a run log</text><text style="--i:30" x="456" y="370" class="t-small fill">and a drilled kill switch</text><text style="--i:30" x="456" y="390" class="t-eyebrow fill">INTERVIEW 9 · FRONTIER OPERATOR</text><text style="--i:31" x="760" y="92" class="t-eyebrow fill">WHAT THIS FLOW REFUSES</text><line style="--i:32" class="fill" x1="760" y1="110" x2="1040" y2="110" stroke="var(--rule)" stroke-width="1"/><text style="--i:32" x="760" y="132" class="t-label t-strong fill">Automating the unproven</text><text style="--i:32" x="760" y="154" class="t-small fill">a workflow you have not done by hand cannot be specified</text><line style="--i:33" class="fill" x1="760" y1="188" x2="1040" y2="188" stroke="var(--rule)" stroke-width="1"/><text style="--i:33" x="760" y="210" class="t-label t-strong fill">Automating the unmeasured</text><text style="--i:33" x="760" y="232" class="t-small fill">no baseline means no claim of improvement, ever</text><line style="--i:34" class="fill" x1="760" y1="266" x2="1040" y2="266" stroke="var(--rule)" stroke-width="1"/><text style="--i:34" x="760" y="288" class="t-label t-strong fill">Automating the unenforceable</text><text style="--i:34" x="760" y="310" class="t-small fill">a boundary the tool cannot hold is a promise, not a control</text></svg><figcaption><span class="fignum">Fig. 12</span><span>Automation decision flow, proven, measured, justified, enforceable</span></figcaption><button class="replay" type="button">Replay</button></figure>

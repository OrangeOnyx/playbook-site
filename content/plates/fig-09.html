<figure class="fig plate"><svg class="fig" viewBox="0 0 1080 420" role="img" aria-labelledby="matrix-title matrix-desc"><title id="matrix-title">Three-zone action matrix</title><desc id="matrix-desc">Actions sort into permitted, approval-required, and never; each row names the real permission or human gate that enforces it.</desc><defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--ink)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--ink)" stroke-opacity="0.18" stroke-width="1"/></pattern></defs><rect style="--i:0" class="stroke" pathLength="1" x="40" y="88" width="320" height="210" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:1" x="58" y="122" class="t-label t-strong fill">Permitted</text><text style="--i:1" x="58" y="142" class="t-eyebrow fill">SAFE · REVERSIBLE · RULE-BOUND</text><rect style="--i:2" class="fill" x="58" y="170" width="10" height="10" fill="var(--ink)" fill-opacity="0.9"/><text style="--i:2" x="78" y="180" class="t-small fill">draft</text><rect style="--i:3" class="fill" x="58" y="196" width="10" height="10" fill="var(--ink)" fill-opacity="0.9"/><text style="--i:3" x="78" y="206" class="t-small fill">summarize</text><rect style="--i:4" class="fill" x="58" y="222" width="10" height="10" fill="var(--ink)" fill-opacity="0.9"/><text style="--i:4" x="78" y="232" class="t-small fill">file to the inbox</text><rect style="--i:5" class="fill" x="58" y="248" width="10" height="10" fill="var(--ink)" fill-opacity="0.9"/><text style="--i:5" x="78" y="258" class="t-small fill">prepare a reply</text><text style="--i:6" x="58" y="282" class="t-eyebrow fill">ACTS, THEN LOGS</text><rect style="--i:7" class="stroke" pathLength="1" x="380" y="88" width="320" height="210" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="1.6"/><text style="--i:8" x="398" y="122" class="t-label t-strong fill">Approval required</text><text style="--i:8" x="398" y="142" class="t-eyebrow fill">DRAFTED · WAITS FOR THE HUMAN GATE</text><rect style="--i:9" class="fill" x="398" y="170" width="10" height="10" fill="currentColor" fill-opacity="0.9"/><text style="--i:9" x="418" y="180" class="t-small fill">send to a client</text><rect style="--i:10" class="fill" x="398" y="196" width="10" height="10" fill="currentColor" fill-opacity="0.9"/><text style="--i:10" x="418" y="206" class="t-small fill">book or schedule</text><rect style="--i:11" class="fill" x="398" y="222" width="10" height="10" fill="currentColor" fill-opacity="0.9"/><text style="--i:11" x="418" y="232" class="t-small fill">change a record</text><text style="--i:12" x="398" y="282" class="t-eyebrow fill">PREPARES, THEN STOPS</text><rect style="--i:13" class="stroke" pathLength="1" x="720" y="88" width="320" height="210" fill="var(--paper-deep)" stroke="var(--ink)" stroke-width="1.25"/><rect style="--i:14" class="fill" x="720" y="88" width="320" height="210" fill="url(#hatch)" opacity="1"/><text style="--i:15" x="738" y="122" class="t-label t-strong fill">Never</text><text style="--i:15" x="738" y="142" class="t-eyebrow fill">NEVER AUTOMATED · NEVER PREPARED</text><rect style="--i:16" class="fill" x="738" y="170" width="10" height="10" fill="var(--ink)" fill-opacity="0.35"/><text style="--i:16" x="758" y="180" class="t-small fill">pay or transfer</text><rect style="--i:17" class="fill" x="738" y="196" width="10" height="10" fill="var(--ink)" fill-opacity="0.35"/><text style="--i:17" x="758" y="206" class="t-small fill">delete</text><rect style="--i:18" class="fill" x="738" y="222" width="10" height="10" fill="var(--ink)" fill-opacity="0.35"/><text style="--i:18" x="758" y="232" class="t-small fill">publish externally</text><text style="--i:19" x="738" y="282" class="t-eyebrow fill">REFUSES, THEN ESCALATES</text><text style="--i:20" x="40" y="52" class="t-eyebrow fill">THREE ZONES · EVERY REAL VERB LANDS IN EXACTLY ONE</text><line style="--i:21" class="stroke" pathLength="1" x1="40" y1="330" x2="1040" y2="330" stroke="var(--ink)" stroke-width="1.25"/><text style="--i:22" x="40" y="358" class="t-eyebrow fill">ENFORCEMENT</text><text style="--i:22" x="40" y="384" class="t-small fill">For every row: what real tool permission enforces this? If none, which human-controlled gate does? A boundary with neither is unenforceable, and Expert cannot graduate with one.</text><text style="--i:23" x="1040" y="358" class="t-eyebrow fill" text-anchor="end">KILL SWITCH · WHO · HOW FAST · WHAT IT DISABLES</text></svg><figcaption class="caption"><span class="fignum">Fig. 09</span><span>The three-zone action matrix, permitted, approval required, never</span></figcaption></figure>
